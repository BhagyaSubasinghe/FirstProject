</div>

</div>

</footer>


<script src="js/products.js"></script>

<script src="js/main.js"></script>

<script src="js/cart.js"></script>

<script>

productsReady.then(() => {


    const params =
        new URLSearchParams(
            window.location.search
        );


    const productId =
        parseInt(
            params.get("id")
        );


    const product =
        products.find(
            item =>
                item.id === productId
        );


    const container =
        document.getElementById(
            "product-container"
        );


    if (!product) {

        container.innerHTML = `

            <div class="section">

                <div class="section-header">

                    <h2>
                        Product Not Found
                    </h2>

                    <a
                        href="index.html"
                        class="black-btn"
                    >
                        Back to Home
                    </a>

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <section class="product-details">


            <div class="product-details-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

            </div>


            <div class="product-details-info">

                <span class="category">

                    ${product.category}

                </span>


                <h1>
                    ${product.name}
                </h1>


                <div class="details-price">

                    ${formatPrice(product.price)}

                </div>


                <p class="details-description">

                    ${product.description}

                </p>


                <div class="size-title">

                    Select Size

                </div>


                <div class="size-options">

                    ${product.sizes.map(size => `

                        <button
                            class="size-option"
                            onclick="selectSize(
                                this,
                                '${size}'
                            )"
                        >
                            ${size}
                        </button>

                    `).join("")}

                </div>


                <div class="quantity-box">

                    <button
                        onclick="changeQuantity(-1)"
                    >
                        −
                    </button>


                    <span id="quantity">
                        1
                    </span>


                    <button
                        onclick="changeQuantity(1)"
                    >
                        +
                    </button>

                </div>


                <div class="product-actions">

                    <button
                        class="add-cart"
                        onclick="handleAddToCart()"
                    >
                        Add to Cart
                    </button>


                    <button
                        class="buy-now"
                        onclick="handleBuyNow()"
                    >
                        Buy Now
                    </button>

                </div>


            </div>

        </section>

    `;


    window.currentProduct = product;

});



let selectedSize = null;

let quantity = 1;



function selectSize(button, size) {

    document
        .querySelectorAll(".size-option")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");

    selectedSize = size;

}



function changeQuantity(change) {

    quantity += change;


    if (quantity < 1) {

        quantity = 1;

    }


    document.getElementById(
        "quantity"
    ).textContent = quantity;

}



function handleAddToCart() {

    if (!selectedSize) {

        alert(
            "Please select a size."
        );

        return;

    }


    addToCart(
        window.currentProduct.id,
        selectedSize,
        quantity
    );

}



function handleBuyNow() {

    if (!selectedSize) {

        alert(
            "Please select a size."
        );

        return;

    }


    addToCart(
        window.currentProduct.id,
        selectedSize,
        quantity
    );


    window.location.href =
        "checkout.html";

}

</script>

</body>
</html>
