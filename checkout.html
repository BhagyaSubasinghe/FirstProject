<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nadiyas Clothing | Checkout</title>

<link rel="stylesheet"
href="css/style.css">

</head>


<body>


<header class="navbar">

<a href="index.html">

<img
src="images/logo.jpg"
class="logo-img"
alt="Nadiyas Clothing">

</a>


<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="women.html">Women</a></li>

<li><a href="men.html">Men</a></li>

<li><a href="kids.html">Kids</a></li>

<li><a href="unisex.html">Unisex</a></li>

</ul>


<div class="nav-actions">

<a href="cart.html"
class="cart-link">

🛒

<span id="cart-count"
class="cart-count">
0
</span>

</a>

</div>

</header>


<section class="checkout-page">


<div class="section-header">

<span>NADIYAS CLOTHING</span>

<h2>Checkout</h2>

</div>


<div class="checkout-layout">


<!-- CUSTOMER FORM -->

<form
id="checkout-form"
class="checkout-form">


<label>
Full Name
</label>

<input
type="text"
id="customer-name"
required
placeholder="Enter your full name">


<label>
Email
</label>

<input
type="email"
id="customer-email"
required
placeholder="Enter your email">


<label>
Phone Number
</label>

<input
type="tel"
id="customer-phone"
required
placeholder="07XXXXXXXX">


<label>
Address
</label>

<textarea
id="customer-address"
required
placeholder="Enter your delivery address">
</textarea>


<label>
City
</label>

<input
type="text"
id="customer-city"
required
placeholder="Enter your city">


<label>
Payment Method
</label>

<select id="payment-method">

<option value="Cash on Delivery">

Cash on Delivery

</option>

</select>


<button
type="submit"
class="place-order">

Place Order

</button>


</form>


<!-- ORDER SUMMARY -->

<div
class="checkout-summary"
id="checkout-summary">

</div>


</div>

</section>


<footer>

<div class="footer-grid">

<div>

<h3>Nadiyas Clothing</h3>

<p>Modern fashion for every style.</p>

</div>


<div>

<h3>Shop</h3>

<a href="women.html">Women</a>

<a href="men.html">Men</a>

<a href="kids.html">Kids</a>

<a href="unisex.html">Unisex</a>

</div>


<div>

<h3>Customer Care</h3>

<a href="cart.html">Cart</a>

</div>


<div>

<h3>Contact</h3>

<p>Colombo, Sri Lanka</p>

</div>

</div>


<div class="footer-bottom">

© 2026 Nadiyas Clothing. All Rights Reserved.

</div>

</footer>


<script src="js/products.js"></script>

<script src="js/main.js"></script>


<script>


const cart =
JSON.parse(
localStorage.getItem("nadiyasCart")
) || [];


const summary =
document.getElementById(
"checkout-summary"
);


if (cart.length === 0) {

summary.innerHTML = `

<h2>Your Cart is Empty</h2>

<p>
Please add products before checkout.
</p>

<a
href="women.html"
class="black-btn">

Continue Shopping

</a>

`;

} else {


let subtotal = 0;


let html = `
<h2>Order Summary</h2>
`;


cart.forEach(item => {

const total =
item.price * item.quantity;


subtotal += total;


html += `

<div class="checkout-item">

<img
src="${item.image}"
alt="${item.name}"
>


<div class="checkout-item-info">

<h4>
${item.name}
</h4>

<p>
Size: ${item.size}
</p>

<p>
Quantity: ${item.quantity}
</p>

<strong>
${formatPrice(total)}
</strong>

</div>

</div>

`;

});


const delivery =
subtotal >= 10000
? 0
: 350;


const grandTotal =
subtotal + delivery;


html += `

<hr>


<div class="summary-row">

<span>Subtotal</span>

<strong>
${formatPrice(subtotal)}
</strong>

</div>


<div class="summary-row">

<span>Delivery</span>

<strong>
${
delivery === 0
? "FREE"
: formatPrice(delivery)
}
</strong>

</div>


<div class="summary-total">

<span>Total</span>

<strong>
${formatPrice(grandTotal)}
</strong>

</div>

`;


summary.innerHTML = html;

}


// PLACE ORDER

document
.getElementById("checkout-form")
.addEventListener(
"submit",
function(event) {

event.preventDefault();


if (cart.length === 0) {

alert("Your cart is empty.");

return;

}


const order = {

orderNumber:
"NAD-" +
Date.now(),

customer: {

name:
document.getElementById(
"customer-name"
).value,

email:
document.getElementById(
"customer-email"
).value,

phone:
document.getElementById(
"customer-phone"
).value,

address:
document.getElementById(
"customer-address"
).value,

city:
document.getElementById(
"customer-city"
).value

},

payment:
document.getElementById(
"payment-method"
).value,

items: cart,

date: new Date().toISOString()

};


localStorage.setItem(
"nadiyasLastOrder",
JSON.stringify(order)
);


localStorage.removeItem(
"nadiyasCart"
);


window.location.href =
"order-success.html";

});

</script>


</body>

</html>
