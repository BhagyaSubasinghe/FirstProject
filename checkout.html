<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Nadiyas Clothing</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<!-- NAVIGATION -->

<nav>

    <div class="logo">

        <a href="index.html">

            <img
                src="../assest/in image/logo image.jpg"
                alt="Nadiyas Clothing">

        </a>

    </div>


    <ul class="nav-links">

        <li>
            <a href="index.html">
                Home
            </a>
        </li>

        <li>
            <a href="about.html">
                About
            </a>
        </li>

        <li>
            <a href="cart.html">
                Cart
            </a>
        </li>

    </ul>

</nav>


<!-- CHECKOUT -->

<main>

<section class="checkout-page">

    <h1>
        Checkout
    </h1>


    <form
        id="checkout-form">


        <!-- CUSTOMER -->

        <h2>
            Customer Information
        </h2>


        <label>
            Full Name
        </label>

        <input
            type="text"
            id="customer-name"
            required>


        <label>
            Email
        </label>

        <input
            type="email"
            id="customer-email"
            required>


        <label>
            Phone Number
        </label>

        <input
            type="tel"
            id="customer-phone"
            required>


        <!-- ADDRESS -->

        <h2>
            Delivery Address
        </h2>


        <label>
            Address
        </label>

        <textarea
            id="address"
            required>
        </textarea>


        <label>
            City
        </label>

        <input
            type="text"
            id="city"
            required>


        <label>
            Postal Code
        </label>

        <input
            type="text"
            id="postal-code"
            required>


        <!-- PAYMENT -->

        <h2>
            Payment Method
        </h2>


        <div>

            <input
                type="radio"
                checked
                disabled>

            Cash on Delivery

        </div>


        <!-- ORDER SUMMARY -->

        <h2>
            Order Summary
        </h2>


        <div id="checkout-items">
        </div>


        <p>
            Subtotal:
            <strong id="checkout-subtotal">
                $0.00
            </strong>
        </p>


        <p>
            Delivery Fee:
            <strong id="checkout-delivery">
                $5.00
            </strong>
        </p>


        <h2>

            Total:
            <span id="checkout-total">
                $0.00
            </span>

        </h2>


        <button
            type="submit">

            Place Cash on Delivery Order

        </button>


    </form>

</section>

</main>


<script src="js/checkout.js"></script>

</body>

</html>
