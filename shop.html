<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadiyas Clothing - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-700 flex flex-col min-h-screen font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-100 py-4 px-8 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="assest/products/logo image.jpg" alt="Logo" class="w-10 h-10 rounded-full object-cover shadow-sm ring-2 ring-sky-100">
            </a>
            
            <div class="space-x-8 text-sm font-medium">
                <a href="index.html" class="hover:text-sky-600 transition">Home</a>
                <a href="shop.html" class="text-sky-600 font-semibold border-b-2 border-sky-600 pb-1">Shop</a>
                <a href="contact.html" class="hover:text-sky-600 transition">Contact Us</a>
                <a href="about.html" class="hover:text-sky-600 transition">About</a>
            </div>

            <div>
                <a href="#" class="text-gray-600 hover:text-sky-600 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 4 0 00-8 0v4M5 11h14l1 12H4L5 11z"></path></svg>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-10 w-full flex-grow">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Shop All</h1>
        <p class="text-xs text-gray-400 mb-8">Home / Shop</p>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- Sidebar Categories -->
            <aside class="space-y-3">
                <h3 class="font-bold text-gray-800 text-sm mb-4">Categories</h3>
                <ul class="space-y-2 text-sm text-gray-600">
                    <li><button onclick="filterCategory('All')" class="hover:text-sky-600 text-left w-full">All Clothing</button></li>
                    <li><button onclick="filterCategory('Womens')" class="hover:text-sky-600 text-left w-full">Womens</button></li>
                    <li><button onclick="filterCategory('Men')" class="hover:text-sky-600 text-left w-full">Mens</button></li>
                    <li><button onclick="filterCategory('Unisex')" class="hover:text-sky-600 text-left w-full">Unisex</button></li>
                    <li><button onclick="filterCategory('Kids')" class="hover:text-sky-600 text-left w-full">Kids</button></li>
                </ul>
            </aside>

            <!-- Products Grid Container -->
            <section class="md:col-span-3">
                <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-gray-400 text-sm col-span-3">Loading products...</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Unified Footer -->
    <footer class="mt-auto bg-white border-t border-gray-100 py-8 text-xs text-gray-400">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <p class="font-semibold text-gray-700 text-sm">Nadiyas Clothing</p>
                <p>© 2026 Nadiyas Clothing. All rights reserved.</p>
            </div>
            <div class="flex space-x-6">
                <a href="#" class="hover:underline">Privacy Policy</a>
                <a href="#" class="hover:underline">Terms of Service</a>
                <a href="#" class="hover:underline">Shipping Info</a>
                <a href="#" class="hover:underline">Returns</a>
            </div>
        </div>
    </footer>

    <!-- Script -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentCategory = urlParams.get('category') || localStorage.getItem('selectedCategory') || 'All';

        async function fetchProducts(category) {
            const grid = document.getElementById('products-grid');
            if (!grid) return;

            grid.innerHTML = '<p class="text-gray-400 text-sm col-span-3">Loading products...</p>';

            try {
                const res = await fetch('../backend/api/products.php?category=' + encodeURIComponent(category));
                const result = await res.json();

                if (result.success && result.data && result.data.length > 0) {
                    let html = '';
                    result.data.forEach(function(p) {
                        let sizesMarkup = '';
                        if (p.sizes) {
                            const sizesArr = p.sizes.split(',');
                            sizesArr.forEach(function(s) {
                                sizesMarkup += '<span class="text-[10px] font-semibold bg-slate-100 text-gray-700 px-2 py-0.5 rounded mr-1">' + s.trim() + '</span>';
                            });
                        }

                        html += '<div class="bg-white rounded-2xl overflow-hidden p-4 border border-gray-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">' +
                            '<div class="h-64 rounded-xl overflow-hidden bg-gray-50 mb-3 relative">' +
                                '<img src="assest/products/' + p.image + '" alt="' + p.name + '" class="w-full h-full object-cover" onerror="this.src=\'https://via.placeholder.com/300x400?text=No+Image\'">' +
                            '</div>' +
                            '<div class="space-y-2">' +
                                '<div class="flex justify-between items-start">' +
                                    '<h4 class="font-bold text-gray-800 text-base">' + p.name + '</h4>' +
                                    '<span class="font-extrabold text-sky-600 text-base">$' + p.price + '</span>' +
                                '</div>' +
                                '<div class="flex items-center justify-between text-xs text-gray-500">' +
                                    '<span>Category: <strong class="text-gray-700">' + p.category + '</strong></span>' +
                                    '<span>Color: <strong class="text-gray-700">' + p.color + '</strong></span>' +
                                '</div>' +
                                '<div class="pt-2 border-t border-gray-100 flex items-center">' +
                                    '<span class="text-xs text-gray-400 mr-1">Sizes:</span>' +
                                    sizesMarkup +
                                '</div>' +
                            '</div>' +
                        '</div>';
                    });
                    grid.innerHTML = html;
                } else {
                    grid.innerHTML = '<p class="text-gray-400 col-span-3 text-sm">No products found for "' + category + '".</p>';
                }
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<p class="text-red-400 col-span-3 text-sm">Error connecting to server or database.</p>';
            }
        }
        
        function filterCategory(cat) {
            localStorage.setItem('selectedCategory', cat);
            fetchProducts(cat);
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetchProducts(currentCategory);
        });
    </script>
</body>
</html>
